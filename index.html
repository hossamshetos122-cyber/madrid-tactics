<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111a20">
<meta name="apple-mobile-web-app-title" content="Madrid Tactics">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Madrid FC · Tactics</title>
<style>
:root{--ink:#111a20;--panel:#182329;--panel2:#202d33;--line:#f3f4ed;--muted:#a7b2ae;--accent:#5d9998;--green1:#477c63;--green2:#42755d;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#3f765c;overscroll-behavior:none;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:#f3f4ed}
body{height:100dvh}
#app{position:fixed;inset:0;overflow:hidden;background:var(--green1)}
#pitch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:absolute;top:calc(var(--safe-t) + 8px);left:12px;right:12px;height:42px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;background:#111a20d9;border:1px solid #ffffff20;border-radius:12px;padding:6px 11px;font-size:13px;font-weight:700;letter-spacing:.2px}
.brand img{width:25px;height:25px;object-fit:contain;border-radius:4px}
.iconbtn{width:40px;height:40px;border:1px solid #ffffff24;border-radius:12px;background:#111a20e8;color:#f4f4ed;display:grid;place-items:center}
.iconbtn svg,.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottom{position:absolute;bottom:calc(var(--safe-b) + 9px);left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;background:#111a20ed;border:1px solid #ffffff20;border-radius:17px;box-shadow:0 8px 25px #07100d55}
.tool{width:57px;height:49px;border:0;background:transparent;color:#aebbb5;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px}
.tool.active{background:#2b3c41;color:#fff}
.tool.active svg{color:#83b7ac}
.sheet-backdrop{position:absolute;inset:0;background:#07100d55;opacity:0;pointer-events:none;transition:opacity 120ms ease}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:min(68dvh,590px);padding:9px 16px calc(var(--safe-b) + 18px);background:#151f25;border:1px solid #ffffff16;border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform 120ms ease;overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.sheet.open{transform:translateY(0)}
.grabber{width:38px;height:4px;border-radius:4px;background:#68777a;margin:0 auto 13px}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sheethead h2{font-size:16px;margin:0;font-weight:750}
.close{border:0;background:#27353b;color:#dfe8e2;border-radius:9px;width:31px;height:31px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.action,.field,.planrow{border:1px solid #ffffff16;background:#202c32;color:#eef2ec;border-radius:12px;padding:12px;font-size:13px;text-align:right;min-height:43px}
.action:active,.iconbtn:active,.tool:active{transform:scale(.97)}
.action.primary{background:#365f5c;border-color:#548985}
.action.danger{color:#f0aaa0}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row>*{flex:1;min-width:0}
.field{width:100%;outline:none;user-select:text;-webkit-user-select:text}
.field::placeholder{color:#83918e}
.section{font-size:11px;color:#93a39d;margin:15px 2px 7px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1px solid #ffffff22;background:#202c32;color:#e8eee8;border-radius:20px;padding:9px 12px;font-size:12px}
.pill.selected{background:#385d58;border-color:#77a79a}
.planrow{display:flex;align-items:center;gap:10px;margin:7px 0}
.thumb{width:42px;height:52px;border-radius:6px;background:repeating-linear-gradient(0deg,#477c63 0 8px,#42755d 8px 16px);border:1px solid #ffffff50;flex:none;position:relative}
.thumb:after{content:"";position:absolute;inset:5px;border:1px solid #fff9;border-radius:2px}
.planname{flex:1;font-weight:650}
.small{font-size:11px;color:#aab8b0}
textarea.field{min-height:84px;resize:none;line-height:1.6}
input[type=color]{width:100%;height:42px;border:0;background:transparent}
.hidden{display:none!important}
.toast{position:absolute;top:calc(var(--safe-t) + 58px);left:50%;transform:translateX(-50%);background:#111a20ed;border:1px solid #ffffff22;border-radius:10px;padding:9px 13px;font-size:12px;opacity:0;transition:opacity 120ms;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
#fileLogo,#restoreFile{display:none}
@media (max-height:650px){.tool{height:43px;width:53px}.bottom{bottom:calc(var(--safe-b) + 5px)}}
</style>
</head>
<body>
<div id="app">
<canvas id="pitch"></canvas>
<div class="top">
 <button class="iconbtn" id="menuBtn" aria-label="القائمة"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
 <div class="brand"><img id="brandLogo" alt=""><span id="planTitle">الخطة الأساسية</span></div>
</div>
<div class="bottom" id="toolbar">
 <button class="tool" data-sheet="players"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="4"/><circle cx="17" cy="16" r="4"/><path d="M2 20c0-3 2-5 6-5M13 4c3 0 5 2 5 5"/></svg>اللاعبون</button>
 <button class="tool" data-sheet="draw"><svg viewBox="0 0 24 24"><path d="m4 17 11-11 4 4L8 21H4zM13 8l4 4M4 21h16"/></svg>الرسم</button>
 <button class="tool" data-sheet="plans"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>الخطط</button>
 <button class="tool" data-sheet="frames"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>اللقطات</button>
 <button class="tool" data-sheet="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>المزيد</button>
</div>
<div class="toast" id="toast"></div>
<div class="sheet-backdrop" id="backdrop"></div>
<section class="sheet" id="sheet">
 <div class="grabber"></div><div class="sheethead"><h2 id="sheetTitle">اللاعبون</h2><button class="close" id="closeSheet">×</button></div>
 <div id="sheetContent"></div>
</section>
<input id="fileLogo" type="file" accept="image/*"><input id="restoreFile" type="file" accept="application/json,.json">
</div>

function editPlayer(id){let p=frame().players.concat(frame().opponents).find(x=>x.id===id);if(!p)return;$('#sheetTitle').textContent='تعديل لاعب';$('#sheetContent').innerHTML=`<div class="row"><label class="small">الرقم</label><input class="field" id="pnum" type="number" min="0" max="99" value="${p.n}"></div><div class="row"><label class="small">الاسم</label><input class="field" id="pname" value="${p.name}"></div><div class="row"><label class="small">المركز</label><input class="field" id="prole" value="${p.role||''}" placeholder="GK / CB / CM / ST"></div><div class="row"><label class="small">اللون</label><input type="color" id="pcolor" value="${p.color}"></div><button class="action primary" id="savePlayer">حفظ التعديل</button>`;$('#savePlayer').onclick=()=>{p.n=Math.max(0,Math.min(99,+$('#pnum').value||0));p.name=$('#pname').value;p.role=$('#prole').value;p.color=$('#pcolor').value;draw();save();openSheet('players')}}
